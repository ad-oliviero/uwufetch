  linux-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y libpci-dev
      - name: unit tests and fuzz (ASan + UBSan)
        run: make test-asan FUZZ_SECONDS=60
      - name: integration tests (ASan + UBSan)
        run: tests/run.sh
