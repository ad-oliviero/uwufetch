name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y libpci-dev
      - name: build
        run: make
      - name: unit tests
        run: make test
      - name: integration tests
        run: tests/run.sh
